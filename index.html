<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, minimum-scale=1.0, user-scalable=yes">
    <title>보안 PDF 교육 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #viewer-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .page-container {
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: white;
        }

        canvas {
            display: block;
        }

        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: auto;
        }

        /* 툴바 스타일 */
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tool-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        .tool-btn.active {
            background: #007AFF;
        }

        .tool-btn i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* 워터마크 */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 4vw;
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
        }

        /* 캡처 방지 트릭 (제한적 효과) */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="viewer-container">
        <!-- PDF 페이지들이 여기에 동적으로 로드됩니다 -->
    </div>

    <div id="toolbar">
        <button class="tool-btn active" id="btn-pan">
            <span>✋</span>
            <span>이동/확대</span>
        </button>
        <button class="tool-btn" id="btn-brush">
            <span>🖌️</span>
            <span>브러쉬</span>
        </button>
        <button class="tool-btn" id="btn-eraser">
            <span>🧽</span>
            <span>지우개</span>
        </button>
        <button class="tool-btn" id="btn-clear">
            <span>🗑️</span>
            <span>초기화</span>
        </button>
    </div>

    <div class="watermark" id="user-watermark">SCHOOL ONLY - DO NOT DISTRIBUTE</div>

    <script src="app.js"></script>
</body>
</html>
